# Local development infrastructure for AUTHENTIC J.A. CONSTRUCTION LTD.
# Usage:
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#   cp infrastructure/docker/.env.example .env   # optional custom overrides
# The matching DATABASE_URL lives in the repo .env (see .env.example).
name: ajac

services:
  postgres:
    image: postgres:16-alpine
    container_name: ajac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ajac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ajac_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ajac}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ajac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ajac} -d ${POSTGRES_DB:-ajac}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: ajac-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ajac_pgdata: